<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime1 Extension</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #111827;
        --panel: #1f2937;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --border: #374151;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 320px;
      }
      .wrap {
        padding: 16px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px 0;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-top: 10px;
      }
      label {
        display: block;
        font-size: 12px;
        margin: 10px 0 4px;
        color: var(--muted);
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #111827;
        color: var(--text);
        box-sizing: border-box;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      .primary {
        background: var(--accent);
        color: #052e16;
      }
      .secondary {
        background: #111827;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
      }
      .tiny {
        font-size: 11px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Anime1 Sync</h1>
      <div class="muted">Sign in with Supabase OAuth or enterprise SSO.</div>

      <div class="panel">
        <div id="status" class="status">Status: checking...</div>
        <div id="emailDisplay" class="muted tiny"></div>

        <label for="provider">OAuth Provider</label>
        <select id="provider">
          <option value="google">Google</option>
          <option value="github">GitHub</option>
        </select>
        <button id="oauthSignIn" class="primary">Sign In with OAuth</button>

        <label for="ssoInput">Enterprise SSO Domain or Provider ID</label>
        <input id="ssoInput" type="text" placeholder="company.com" />
        <button id="ssoSignIn" class="secondary">Enterprise SSO</button>

        <button id="signOut" class="secondary">Sign Out</button>

        <label>OAuth URL</label>
        <div id="oauthUrl" class="muted tiny"></div>

        <label>Redirect URL</label>
        <div id="redirectUrl" class="muted tiny"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
